apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace, its RBAC and the <app>-env Secret are managed by infra-tg (Terragrunt).
namespace: pandora

resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml

labels:
  - pairs:
      app.kubernetes.io/name: pandora
    includeSelectors: true

# The deploy job sets newTag to the commit SHA (kustomize edit set image).
images:
  - name: app
    newName: ghcr.io/davvos11/pandoratool
    newTag: latest
