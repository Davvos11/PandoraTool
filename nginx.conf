server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    # Relative redirects: behind Traefik the container's own port must not leak into Location.
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /pandora {
        return 301 /pandora/;
    }

    location /pandora/ {
        try_files $uri $uri/ =404;
    }
}
